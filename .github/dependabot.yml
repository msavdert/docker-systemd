version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /almalinux
      - /amazonlinux
      - /centos
      - /debian
      - /fedora
      - /opensuse
      - /oraclelinux
      - /rockylinux
      - /ubuntu
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      docker-base-images:
        patterns:
          - "*"
