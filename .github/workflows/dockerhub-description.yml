name: Update DockerHub Description

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml

jobs:
  dockerhub-description:
    name: Update DockerHub Description
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_REPOSITORY: melihsavdert/docker-systemd
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: DockerHub Description
        id: dockerhub_description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPOSITORY }}
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true

      - name: Explain DockerHub sync failure
        if: ${{ steps.dockerhub_description.outcome == 'failure' }}
        run: |
          {
            echo "Docker Hub description sync did not complete."
            echo "Expected repository: $DOCKERHUB_REPOSITORY"
            echo "Confirm the repository exists on Docker Hub and that DOCKERHUB_USERNAME/DOCKERHUB_TOKEN can update its metadata."
          } >> "$GITHUB_STEP_SUMMARY"
