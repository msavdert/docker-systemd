name: Build docker images

on:
  push:
    branches:
      - main
    paths:
      - "**.Dockerfile"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 0"

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE_NAME: melihsavdert/docker-systemd
  GHCR_IMAGE_NAME: ghcr.io/msavdert/docker-systemd
  IMAGE_DESCRIPTION: Reusable multi-distribution Docker images with working systemd support for Ansible role testing, Molecule scenarios, CI jobs, and other cases where a minimal base image is not enough.

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      is-empty: ${{ steps.matrix.outputs.is-empty }}
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build matrix
        id: matrix
        run: |
          set -euo pipefail

          FULL_MATRIX=$(jq -c '.' .github/matrix.json)
          USE_FULL=false

          if [ "${{ github.event_name }}" != "push" ]; then
            USE_FULL=true
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              USE_FULL=true
            elif ! git diff --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed.txt; then
              USE_FULL=true
            fi
          fi

          if [ "$USE_FULL" = "true" ]; then
            MATRIX="$FULL_MATRIX"
          elif grep -qx '.github/workflows/build-and-push.yml' /tmp/changed.txt; then
            MATRIX="$FULL_MATRIX"
          else
            MATRIX=$(jq -c --rawfile changed /tmp/changed.txt '
              ($changed | rtrimstr("\n") | split("\n")) as $files
              | [ .[] | select(.dockerfile as $d | $files | index($d) != null) ]
            ' .github/matrix.json)
          fi

          echo "Selected matrix:"
          echo "$MATRIX" | jq .

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "is-empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-empty=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Build and push
    needs: prepare
    if: needs.prepare.outputs.is-empty != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          context: .
          file: ${{ matrix.dockerfile }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=GPL-3.0
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ matrix.tag }}
            ${{ env.GHCR_IMAGE_NAME }}:${{ matrix.tag }}
