name: Validate docker images

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.Dockerfile"
      - ".github/matrix.json"
      - ".github/workflows/validate.yml"
      - ".github/workflows/build-and-push.yml"

jobs:
  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7

      - name: Run hadolint
        run: |
          set -euo pipefail
          find . -name '*.Dockerfile' -print0 | while IFS= read -r -d '' dockerfile; do
            docker run --rm -i --entrypoint hadolint hadolint/hadolint \
              --ignore DL3007 \
              --ignore DL3008 \
              --ignore DL3033 \
              --ignore DL3037 \
              --ignore DL3041 \
              --ignore DL4006 \
              --ignore SC2086 \
              - < "$dockerfile"
          done

  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      is-empty: ${{ steps.matrix.outputs.is-empty }}
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build matrix
        id: matrix
        run: |
          set -euo pipefail

          FULL_MATRIX=$(jq -c '[.[] | {tag, dockerfile}]' .github/matrix.json)
          USE_FULL=false

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || ! git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt; then
            USE_FULL=true
          fi

          if [ "$USE_FULL" = "true" ]; then
            MATRIX="$FULL_MATRIX"
          elif grep -qx '.github/workflows/validate.yml' /tmp/changed.txt \
            || grep -qx '.github/workflows/build-and-push.yml' /tmp/changed.txt \
            || grep -qx '.github/matrix.json' /tmp/changed.txt; then
            MATRIX="$FULL_MATRIX"
          else
            MATRIX=$(jq -c --rawfile changed /tmp/changed.txt '
              ($changed | rtrimstr("\n") | split("\n")) as $files
              | [ .[] | select(.dockerfile as $d | $files | index($d) != null) | {tag, dockerfile} ]
            ' .github/matrix.json)
          fi

          echo "Selected matrix:"
          echo "$MATRIX" | jq .

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "is-empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-empty=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build test images
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.is-empty != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=${{ matrix.tag }}-pr
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}-pr
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: local/${{ matrix.tag }}:pr
